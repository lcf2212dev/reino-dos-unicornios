<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ícones do jogo</title>
<style>
  body { background: #fff8ee; color: #3a2446; font: 13px monospace; margin: 12px; }
  .grade { display: flex; flex-wrap: wrap; gap: 8px; }
  .cel { width: 132px; padding: 6px; text-align: center; background: #fff; border: 2px solid #3a2446; }
  .cel canvas { display: block; margin: 0 auto 4px; image-rendering: pixelated; }
  .tira { display: flex; justify-content: center; gap: 6px; padding: 4px; }
  .tira.escura { background: #2a1838; }
</style>
</head>
<body>
<h1>Ícones do jogo</h1>
<p>Cada ícone em 6x e no tamanho do jogo (fundo claro e escuro).</p>
<div class="grade" id="grade"></div>
<script src="../js/icones.js"></script>
<script src="../js/pixelart.js"></script>
<script>
(function () {
  var grade = document.getElementById('grade');
  Object.keys(window.ICONES).forEach(function (k) {
    var ic = window.ICONES[k];
    var cel = document.createElement('div');
    cel.className = 'cel';
    var grande = PA.matriz(ic.d, ic.p);
    cel.appendChild(PA.paraDOM(grande, 6));
    ['clara', 'escura'].forEach(function (fundo) {
      var tira = document.createElement('div');
      tira.className = 'tira ' + fundo;
      tira.appendChild(PA.paraDOM(grande, PA.escalaNitida(24, 16)));
      tira.appendChild(PA.paraDOM(grande, PA.escalaNitida(36, 16)));
      cel.appendChild(tira);
    });
    cel.appendChild(document.createTextNode(k.indexOf('menu:') === 0 ? k : k + ' ' + ic.n));
    grade.appendChild(cel);
  });
})();
</script>
</body>
</html>
