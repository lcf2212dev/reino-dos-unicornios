<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>teste-graficos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23c6e15a' width='16' height='16'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="reino" width="1280" height="720"></canvas>
<script src="../../js/manifesto.js"></script>
<script src="previa.js"></script>
<script>Previa.carregar({ nomes: ['nucleo/config', 'nucleo/registros', 'nucleo/util', 'arte/pixelart', 'personagens/unicornios',
  'conteudo/materias/registro',
  'conteudo/materias/historia/h1', 'conteudo/materias/historia/h2', 'conteudo/materias/historia/h3', 'conteudo/materias/historia/h4', 'conteudo/materias/historia/h5', 'conteudo/materias/historia/livro', 'conteudo/materias/historia/historia'], grupos: ['mundo'] });</script>
<script>
/* Carrega os pintores do mesmo jeito que jogo/index.html: script clássico, sem módulo. */
(function () {
  function analisar(canvas) {
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    var d = ctx.getImageData(0, 0, w, h).data;
    var cores = Object.create(null);
    var n = 0, opaque = 0;
    var minX = w, minY = h, maxX = -1, maxY = -1;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var i = (y * w + x) * 4;
      if (d[i + 3] <= 16) continue;
      opaque++;
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x > maxX) maxX = x;
      if (y > maxY) maxY = y;
      var chave = d[i] + ',' + d[i + 1] + ',' + d[i + 2];
      if (!cores[chave]) { cores[chave] = 1; n++; }
    }
    var bw = maxX >= 0 ? maxX - minX + 1 : 0;
    var bh = maxY >= 0 ? maxY - minY + 1 : 0;
    var caixa = bw * bh;
    return {
      w: w, h: h, opaque: opaque, total: w * h,
      fraction: w * h ? opaque / (w * h) : 0,
      cores: n,
      retanguloSolido: n <= 1 && caixa > 0 && opaque === caixa,
    };
  }

  var falhas = [];
  Mapa.criar(Reino.materias);
  var mapa = Mapa.prerender();
  var vista = document.getElementById('reino');
  vista.width = 1280;
  vista.height = 720;
  var ctx = vista.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  var escala = 3;
  var vw = Math.ceil(vista.width / escala);
  var vh = Math.ceil(vista.height / escala);
  ctx.drawImage(mapa, 8 * 16, 6 * 16, vw, vh, 0, 0, vw * escala, vh * escala);

  var frame = analisar(vista);
  if (vista.width !== 1280 || vista.height !== 720) falhas.push('quadro fora do tamanho da vista');
  if (frame.fraction < 0.7) falhas.push('quadro pouco pintado');
  if (frame.cores < 8) falhas.push('quadro quase de uma cor só');

  var mariana = PA.mariana(PA.APARENCIA_PADRAO, false, 0, { vista: 'lado' }).canvas;
  var unicornio = PA.unicornio(Reino.Unicornios.def('inicial', 'rosa'), 2, 0, { vista: 'lado' }).canvas;
  var am = analisar(mariana);
  var au = analisar(unicornio);
  if (am.cores < 2 || am.retanguloSolido) falhas.push('Mariana não é um sprite de várias cores');
  if (au.cores < 2 || au.retanguloSolido) falhas.push('unicórnio não é um sprite de várias cores');

  var rel = { ok: falhas.length === 0, falhas: falhas, frame: frame, mariana: am, unicornio: au };
  document.title = rel.ok ? 'PASS' : 'FAIL';
  var pre = document.createElement('pre');
  pre.id = 'resultado';
  pre.textContent = JSON.stringify(rel);
  document.body.appendChild(pre);
})();
</script>
</body>
</html>
