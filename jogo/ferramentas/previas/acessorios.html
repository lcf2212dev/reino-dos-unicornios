<!doctype html>
<meta charset="utf-8">
<title>Prévia dos acessórios</title>
<style>
  body{background:#bfe8c0;color:#3a2446;font:14px sans-serif;margin:16px}
  canvas{image-rendering:pixelated;display:block;margin:0 auto}
  h3{margin:18px 0 4px} h3 small{font-weight:normal}
  .cab{display:flex;gap:12px;align-items:center}
  table{border-collapse:collapse} td,th{padding:3px 5px;text-align:center;vertical-align:bottom;font-size:11px}
  th{font-weight:normal;color:#5e3f6e} td{background:#cdeecb}
  #filtro{margin-bottom:8px}
</style>
<p>Cada enfeite da Loja das Fadas e cada prêmio da Escola em todas as vistas (8 direções: as da esquerda são o espelho),
em cada estágio, e montado. Filtre com <code>?id=anel-saturno,colar-planetas</code> ou <code>?novos=1</code>.</p>
<div id="r"></div>
<script src="../../js/manifesto.js"></script>
<script src="previa.js"></script>
<script>Previa.carregar({ nomes: ['nucleo/config', 'nucleo/registros', 'nucleo/util', 'nucleo/eventos', 'conteudo/loja-itens'], grupos: ['icones', 'pixelart'] });</script>
<script>
// um unicórnio comum (sem asas) e um lendário (com asas), para ver o enfeite nos dois
var DEFS = {
  comum: { id: 'p', raridade: 'comum', cores: { corpo: '#fff5fa', crina: ['#ff7eb6', '#b58cff', '#7fd6ff'], chifre: '#ffd34d' } },
  lendario: { id: 'q', raridade: 'lendario', cores: { corpo: '#e8f0ff', crina: ['#5fb4ff', '#6fdc8c', '#ffd34d'], chifre: '#ff9cc6', asa: '#fff6c8' } },
};
var OITO = [
  ['→', 'lado', false], ['↘', 'diagFrente', false], ['↓', 'frente', false], ['↙', 'diagFrente', true],
  ['←', 'lado', true], ['↖', 'diagCostas', true], ['↑', 'costas', false], ['↗', 'diagCostas', false],
];
var LINHAS = [
  ['bebê', 0, false, 'comum'], ['pequeno', 1, false, 'comum'], ['jovem', 2, false, 'lendario'], ['adulto', 3, false, 'comum'],
  ['montada (pequeno)', 1, true, 'lendario'], ['montada (adulto)', 3, true, 'comum'],
];
var q = new URLSearchParams(location.search);
var so = q.get('id') ? q.get('id').split(',') : null;
var ESC = +(q.get('escala') || 3);
var L = Reino.LojaItens;
var nomes = {};
L.ENFEITES.forEach(function (e) { nomes[e.id] = e; });
var ANTIGOS = ['flor', 'laco', 'oculos', 'coroa', 'tiara-arco-iris', 'pena-magica', 'laco-vovo', 'coroa-big-ben', 'oculos-de-sol', 'lacinho-estrela'];
var ids = Object.keys(PA.ENFEITES_MONTARIA).filter(function (id) {
  if (so) return so.indexOf(id) >= 0;
  if (q.get('novos')) return ANTIGOS.indexOf(id) < 0;
  return true;
});
function espelhar(c) {
  var n = document.createElement('canvas'); n.width = c.width; n.height = c.height;
  var x = n.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
  return n;
}
var r = document.getElementById('r');
ids.forEach(function (id) {
  var e = PA.ENFEITES_MONTARIA[id], it = nomes[id];
  var h = document.createElement('h3');
  var ic = PA.iconeDesenho(it ? it.icone : 'acessorio:' + id);
  var cab = document.createElement('div'); cab.className = 'cab';
  if (ic) cab.appendChild(PA.paraDOM(ic, 3));
  h.innerHTML = id + ' <small>' + (it ? it.nome + ' • ⭐ ' + it.preco + (it.espaco ? ' • espaço' : '') : 'prêmio da Escola') + ' • encaixe: ' + e.ancora + '</small>';
  cab.appendChild(h); r.appendChild(cab);
  var t = document.createElement('table'), tr = document.createElement('tr');
  tr.appendChild(document.createElement('th'));
  OITO.forEach(function (o) { var th = document.createElement('th'); th.textContent = o[0] + ' ' + o[1] + (o[2] ? ' (espelho)' : ''); tr.appendChild(th); });
  t.appendChild(tr);
  LINHAS.forEach(function (l) {
    var tr = document.createElement('tr'), th = document.createElement('th');
    th.textContent = l[0]; tr.appendChild(th);
    OITO.forEach(function (o) {
      var td = document.createElement('td');
      var def = DEFS[l[3]], op = { enfeites: [id], vista: o[1] };
      var spr = l[2] ? PA.montada(def, l[1], 0, PA.APARENCIA_PADRAO, op) : PA.unicornio(def, l[1], 0, op);
      var c = o[2] ? espelhar(spr.canvas) : spr.canvas;
      td.appendChild(PA.paraDOM(c, ESC));
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  r.appendChild(t);
});
</script>
