<!doctype html>
<meta charset="utf-8">
<title>Prévia dos sprites</title>
<style>body{background:#bfe8c0;font:14px sans-serif;margin:16px} .l{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px} canvas{image-rendering:pixelated}</style>
<div id="r"></div>
<script src="../js/config.js"></script>
<script src="../js/pixelart.js"></script>
<script>
var defs = [
  {id:'a', raridade:'comum', cores:{corpo:'#ffffff', crina:['#ff7eb6','#b58cff','#7fd6ff'], chifre:'#ffd34d'}},
  {id:'b', raridade:'raro', cores:{corpo:'#dff1ff', crina:['#4a9dff','#ff5c8a','#ffffff'], chifre:'#ffb020'}},
  {id:'c', raridade:'epico', cores:{corpo:'#ffe98a', crina:['#ff9d2e','#ff5c8a','#fff1b3'], chifre:'#ffffff', asa:'#fff6d6'}},
  {id:'d', raridade:'lendario', cores:{corpo:'#fff7fb', crina:['#ff6b8a','#ffb020','#5fb4ff'], chifre:'#ffd34d', asa:'#ffe6f5'}},
];
var r = document.getElementById('r'), E = 5;
function linha(){ var d=document.createElement('div'); d.className='l'; r.appendChild(d); return d; }
defs.forEach(function(d){
  var l = linha();
  for (var e=0;e<4;e++) for (var q=0;q<2;q++) l.appendChild(PA.paraDOM(PA.unicornio(d,e,q), E));
});
var l = linha();
var ap = PA.APARENCIA_PADRAO;
l.appendChild(PA.paraDOM(PA.montada(defs[0],1,0,ap,{}),E));
l.appendChild(PA.paraDOM(PA.montada(defs[0],3,0,ap,{enfeites:['coroa','oculos'],capa:true}),E));
l.appendChild(PA.paraDOM(PA.montada(defs[3],3,1,ap,{enfeites:['laco']}),E));
l.appendChild(PA.paraDOM(PA.mariana(ap,false,0),E));
l.appendChild(PA.paraDOM(PA.mariana(ap,false,1),E));
l.appendChild(PA.paraDOM(PA.claude(0),E));
l.appendChild(PA.paraDOM(PA.claude(1),E));
var l2 = linha();
['comum','raro','epico','lendario'].forEach(function(rr,i){ l2.appendChild(PA.paraDOM(PA.ovo(rr,i),E)); });
l2.appendChild(PA.paraDOM(PA.silhueta(PA.unicornio(defs[1],3,0)),E));
</script>
